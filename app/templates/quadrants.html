<div class="quality-grid">
  <section class="panel" aria-labelledby="matrix-title">
    <div class="panel-header"><h2 id="matrix-title">证据严重度矩阵</h2><span class="panel-meta" id="matrix-meta">柜位</span></div>
    <div id="matrix" class="figure-body"><p class="empty">运行审计后查看柜位。</p></div>
  </section>
  <section class="panel" aria-labelledby="gap-title">
    <div class="panel-header"><h2 id="gap-title">分层样本缺口</h2><span class="panel-meta" id="gap-meta">按店组</span></div>
    <div id="gap" class="figure-body"><p class="empty">运行后核对有效覆盖。</p></div>
    <div class="gap-legend"><span><i class="legend-swatch verified"></i>已核</span><span><i class="legend-swatch pending"></i>待证</span><span><i class="legend-swatch isolated"></i>隔离</span><span><i class="legend-swatch unfilled"></i>缺额</span></div>
  </section>
  <section class="panel" aria-labelledby="cases-title">
    <div class="panel-header"><h2 id="cases-title">柜位处置</h2><span class="panel-meta" id="cases-meta">已抽中</span></div>
    <div id="cases" class="case-list"><p class="empty">运行后查看处置记录。</p></div>
  </section>
  <section class="panel" aria-labelledby="account-title">
    <div class="panel-header"><h2 id="account-title">结算摘录</h2><span class="panel-meta" id="account-meta">人民币 · 元</span></div>
    <div class="account-body" id="account"><p class="empty">待首笔巡检结算。</p></div>
  </section>
</div>
